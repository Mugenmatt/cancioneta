# Objetivo total y distribución de REFERENCIA (no obligatoria).
total_objetivo: 30000

distribucion_referencia:
  libro: 4500
  pelicula: 3000
  serie: 1500
  cancion: 4000
  poema: 2500
  cita: 3000
  guion: 500
  personaje: 4500
  prompt: 4000
  imagen: 2500

# Cuando una categoría no llega a su referencia, el faltante se redistribuye hacia las
# categorías que SÍ tienen registros verificados disponibles por encima de su referencia,
# proporcionalmente a estos pesos (0 = no recibe faltante). Nunca se inventan registros.
pesos_redistribucion:
  libro: 3
  pelicula: 3
  serie: 1
  cancion: 3
  poema: 2
  cita: 2
  guion: 0
  personaje: 3
  prompt: 1
  imagen: 2

# Los colectores dejan de pedir datos de una categoría al llegar a referencia * factor.
factor_sobrecolecta: 1.3

# Plan de los 4.000 prompts originales (sumas = 4000)
prompts_plan:
