  escenarios: 400
  relaciones: 360
  conflictos: 360
  emociones: 360
  objetos: 360
  recuerdos: 360
  imagenes_mentales: 360
  situaciones_extranas: 360
  contradicciones: 340
  historias_incompletas: 340
