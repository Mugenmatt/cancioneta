# Registro de fuentes. "verificar_en" es el enlace donde confirmar la licencia vigente ANTES de
# publicar la app. Las licencias anotadas reflejan lo que sé al escribir este archivo; pueden cambiar.
fuentes:
  wikidata:
    nombre: "Wikidata"
    url: "https://www.wikidata.org/"
    licencia_datos: "CC0 1.0"
    atribucion: "Datos: Wikidata (CC0 1.0)"
    verificar_en: "https://www.wikidata.org/wiki/Wikidata:Licensing"
    nota: "Metadatos factuales. No contienen el texto de las obras."
  openlibrary:
    nombre: "Open Library"
    url: "https://openlibrary.org/"
    licencia_datos: "Dominio publico / CC0 (segun Open Library)"
    atribucion: "Datos: Open Library"
    verificar_en: "https://openlibrary.org/developers/dumps"
    nota: "Metadatos bibliograficos. Respetar limites de la API y User-Agent con contacto."
  gutendex:
    nombre: "Project Gutenberg via Gutendex"
    url: "https://gutendex.com/"
    licencia_datos: "Catalogo de Project Gutenberg (ver terminos); obras en dominio publico en EE. UU."
    atribucion: "Datos: Project Gutenberg / Gutendex"
    verificar_en: "https://www.gutenberg.org/policy/permission.html"
    nota: "Solo metadatos y enlace. El dominio publico en Argentina se calcula aparte por fallecimiento del autor."
  musicbrainz:
    nombre: "MusicBrainz"
    url: "https://musicbrainz.org/"
    licencia_datos: "Datos principales CC0; datos suplementarios (etiquetas, notas) CC BY-NC-SA"
    atribucion: "Datos: MusicBrainz (CC0)"
    verificar_en: "https://musicbrainz.org/doc/About/Data_License"
    nota: "El colector NO copia etiquetas (datos suplementarios no comerciales)."
  commons:
    nombre: "Wikimedia Commons"
    url: "https://commons.wikimedia.org/"
    licencia_datos: "Licencia propia de cada archivo (CC0, dominio publico, CC BY, CC BY-SA)"
    atribucion: "Segun cada archivo (ver columna atribucion)"
    verificar_en: "https://commons.wikimedia.org/wiki/Commons:Licensing"
    nota: "Se aceptan solo licencias abiertas compatibles; se descartan NC y ND."
  wikiquote:
    nombre: "Wikiquote (es)"
    url: "https://es.wikiquote.org/"
    licencia_datos: "Compilacion CC BY-SA 4.0; la cita depende de los derechos de su autor"
    atribucion: "Compilacion: Wikiquote (CC BY-SA)"
    verificar_en: "https://foundation.wikimedia.org/wiki/Policy:Terms_of_Use"
    nota: "Solo se aceptan citas con fuente anotada y autor con plazo vencido; el resto queda pendiente."
  prompts_originales:
    nombre: "Prompts originales del proyecto"
    url: ""
    licencia_datos: "Original del proyecto"
    atribucion: "Original"
    verificar_en: ""
    nota: "Creados para este proyecto; no se atribuyen a terceros."
  manual:
    nombre: "Carga manual curada"
    url: ""
    licencia_datos: "Segun cada registro"
    atribucion: "Segun cada registro"
    verificar_en: ""
    nota: "Cada fila debe traer fuente, URL y derechos documentados."
