# ============================================================
# CONFIGURACIÓN GENERAL DEL PIPELINE
# ============================================================

# OBLIGATORIO: Wikimedia, MusicBrainz y Open Library exigen un User-Agent que
# identifique el proyecto y un contacto real. Completá el mail antes de correr
# cualquier colector. Con el valor por defecto el pipeline se niega a consultar APIs.
proyecto: "CulturaDB para app de composicion de canciones"
contacto: "matialmacena0@gmail.com"

rutas:
  db: "data/db/cultura.sqlite"
  cache: "data/cache"
  exports: "data/exports"
  logs: "data/logs"
  prompts: "data/prompts"
  manual: "data/manual"
  seeds: "data/seeds"

http:
  timeout_segundos: 60
  reintentos: 5
  cache_ttl_dias: 30
  # Pausa mínima (segundos) entre dos pedidos al mismo host. Respetá los límites de cada servicio.
  intervalo_por_host:
    query.wikidata.org: 2.0
    www.wikidata.org: 0.5
    musicbrainz.org: 1.1          # límite oficial: 1 pedido por segundo
    openlibrary.org: 1.0
    gutendex.com: 1.0
    commons.wikimedia.org: 0.5
    es.wikiquote.org: 0.5
    es.wikipedia.org: 0.25
    default: 1.0

verificacion:
  # Años de vida del autor + N para considerar vencido el plazo (Argentina, Ley 11.723: 70 años).
  plazo_autor_anios: 70
  jurisdiccion: "AR"
  # Enlaces: solo 404 y 410 se consideran "rotos". 403/429/5xx/timeouts son inconcluyentes.
  enlace_ttl_dias: 30
  enlace_muestra_por_defecto: 500

duplicados_cercanos:
  umbral_jaccard: 0.85          # similitud de tokens para marcar prompts/citas casi iguales
  categorias: ["prompt", "cita"]

exportacion:
  # Excel de hasta 1.048.576 filas por hoja; este límite avisa antes.
  max_filas_por_hoja: 1000000
