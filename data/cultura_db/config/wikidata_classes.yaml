# Clases (QIDs) y propiedades de Wikidata usadas por el colector.
# IMPORTANTE: verificá los QIDs con:  python run.py doctor
# (imprime la etiqueta real de cada QID para confirmar que es la clase que buscás).
# Wikidata es CC0. Solo se piden elementos que tengan artículo en es.wikipedia.org
# (evita elementos sin etiqueta y asegura notoriedad y un enlace de lectura).

